name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh -n run.sh
      - run: node --check spinner.js style.js presets.js toml-theme.js config.js
      - run: node --test test/*.test.js
