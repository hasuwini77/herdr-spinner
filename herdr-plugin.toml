id = "hasuwini77.spinner"
name = "Agent Spinner"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Animated spinner styles and theme presets for Herdr: restyle the sidebar without changing how it works"
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "run.sh"]

[[actions]]
id = "restart"
title = "Restart agent spinner"
contexts = ["workspace"]
command = ["sh", "run.sh", "--restart"]

[[actions]]
id = "stop"
title = "Stop agent spinner"
contexts = ["workspace"]
command = ["sh", "run.sh", "--stop"]

[[actions]]
id = "next-spinner"
title = "Next spinner style"
contexts = ["workspace"]
command = ["sh", "run.sh", "--style", "spinner", "next"]

[[actions]]
id = "next-theme"
title = "Next theme preset"
contexts = ["workspace"]
command = ["sh", "run.sh", "--style", "theme", "next"]

[[actions]]
id = "reset-theme"
title = "Restore my original theme"
contexts = ["workspace"]
command = ["sh", "run.sh", "--style", "theme", "reset"]
